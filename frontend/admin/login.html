<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Acceso · Taller</title>
    <link rel="stylesheet" href="css/neo.css" />
  </head>
  <body>
    <main class="contenedor" style="max-width: 460px; padding-top: 12vh">
      <section class="tarjeta">
        <h1>Panel del taller</h1>
        <form id="login">
          <input id="email" type="email" placeholder="Correo" required /><input
            id="password"
            type="password"
            placeholder="Contraseña"
            required
          /><button class="primario">Entrar</button>
        </form>
        <p id="mensaje" class="error"></p>
      </section>
    </main>
    <script src="js/login.js"></script>
  </body>
</html>
