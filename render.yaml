services:
  - type: web
    name: taller-reparaciones
    runtime: node
    rootDir: backend
    buildCommand: npm ci && npx prisma generate && npx prisma db push
    startCommand: npm start
    healthCheckPath: /salud
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: taller-reparaciones-db
          property: connectionString

databases:
  - name: taller-reparaciones-db
    databaseName: reparaciones
    user: reparaciones
    plan: free
